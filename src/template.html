<title>Arabic Orbit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Learn Arabic from zero: free video lessons, free sample pages and printable Arabic workbooks in 11 languages.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Inter:wght@400;500;600&family=Amiri:wght@400;700&display=swap">
<style>
/* Layout: one bright, sunny theme (always light): mint and coral; open-book hero, then letters, videos, editions, free pages */
:root{
  --bg:#f6fcf9; --surface:#ffffff; --ink:#0b3d31; --muted:#4f6b62; --line:#d4ece2;
  --navy:#c9f0e0; --gold:#ff6f61; --gold-soft:#ffe7e4; --on-navy:#0b3d31; --teal:#12a37f; color-scheme:light;
  --f-display:"Lexend",system-ui,sans-serif; --f-body:"Inter",system-ui,sans-serif; --f-ar:"Amiri","Noto Naskh Arabic","Traditional Arabic",serif;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);line-height:1.2;text-wrap:balance;margin:0}
h2{font-size:clamp(1.5rem,3vw,2rem)}
a{color:inherit}
.eyebrow{font-family:var(--f-display);font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:600}
section{padding-block:56px}
.lead{color:var(--muted);max-width:60ch;margin:.5rem 0 0}
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.75rem 1.2rem;border-radius:999px;font-weight:600;text-decoration:none;font-family:var(--f-display);font-size:.95rem;border:2px solid transparent;transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn-gold{background:var(--gold);color:#fff;box-shadow:0 6px 0 -2px #d94e41}
.btn-ghost{border-color:currentColor}

/* header */
header.top{background:var(--navy);color:var(--on-navy);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding-block:12px}
.brand{display:flex;align-items:center;gap:.6rem;text-decoration:none;font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.brand .mark{width:46px;height:44px;background:#fff;border-radius:12px;padding:3px;flex:none}
.brand b{color:var(--gold)}
.nav ul{display:flex;gap:1.2rem;list-style:none;margin:0;padding:0;font-size:.9rem}
.nav ul a{text-decoration:none;opacity:.85}.nav ul a:hover{opacity:1;color:var(--gold)}
@media (max-width:720px){.nav ul{display:none}}

/* hero */
.hero{background:linear-gradient(160deg,#c9f0e0 0%,#effbf6 100%);color:var(--on-navy);padding-block:56px 72px;position:relative;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(2rem,5vw,3.3rem)}
.hero h1 span{color:var(--gold)}
.hero p{color:color-mix(in srgb,var(--on-navy) 80%,transparent);max-width:52ch;font-size:1.08rem}
.hero .ctas{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:1.5rem}
.hero .facts{display:flex;flex-wrap:wrap;gap:1.5rem;margin-top:2rem;font-size:.9rem}
.hero .facts strong{display:block;font-family:var(--f-display);font-size:1.5rem;color:var(--gold)}
.book{aspect-ratio:3/4;max-width:100%;width:280px;justify-self:center;border-radius:6px 14px 14px 6px;background:linear-gradient(135deg,#1fbf95,#0e8a6b);border:0;box-shadow:16px 20px 0 -6px rgba(255,111,97,.6),0 24px 40px rgba(31,42,68,.18);padding:28px 24px;display:flex;flex-direction:column;justify-content:space-between;color:#ffffff;position:relative}
.book::before{content:"";position:absolute;left:12px;top:0;bottom:0;width:2px;background:rgba(255,255,255,.5)}
.book .ar{font-family:var(--f-ar);font-size:4.2rem;color:#ffd3cc;text-align:center;line-height:1.3;direction:rtl}
.book .t{font-family:var(--f-display);font-weight:700;font-size:1.25rem}
.book .s{font-size:.8rem;opacity:.75}
@media (max-width:820px){.hero-grid{grid-template-columns:1fr}.book{width:220px}}

/* letters */
.alpha-wrap{display:grid;grid-template-columns:1fr 300px;gap:28px;margin-top:28px;align-items:start}
@media (max-width:820px){.alpha-wrap{grid-template-columns:1fr}}
.alpha{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;direction:rtl}
@media (max-width:480px){.alpha{grid-template-columns:repeat(5,1fr)}}
.alpha button{font-family:var(--f-ar);font-size:1.9rem;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;aspect-ratio:1;cursor:pointer;line-height:1;transition:background .15s,border-color .15s}
.alpha button:hover{border-color:var(--gold)}
.alpha button:nth-child(4n+1){background:#e3f7ef}.alpha button:nth-child(4n+2){background:#ffe7e4}.alpha button:nth-child(4n+3){background:#eefaf5}.alpha button:nth-child(4n){background:#fff0ec}
.alpha button[aria-pressed="true"]{background:var(--gold);color:#fff;border-color:var(--gold)}
.detail{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px}
.detail .big{font-family:var(--f-ar);font-size:5rem;text-align:center;line-height:1.3;color:var(--gold)}
.detail .name{text-align:center;font-family:var(--f-display);font-weight:600;font-size:1.2rem}
.detail .sound{text-align:center;color:var(--muted);font-size:.9rem}
.forms{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:16px;direction:rtl}
.forms div{text-align:center;border-top:1px solid var(--line);padding-top:8px}
.forms .g{font-family:var(--f-ar);font-size:2rem;line-height:1.4}
.forms small{display:block;direction:ltr;color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em}
button.big{display:block;width:100%;background:none;border:0;cursor:pointer;color:var(--gold);font-family:var(--f-ar)}
.say-name{display:flex;align-items:center;justify-content:center;gap:8px;margin:12px auto 0;font:600 .9rem var(--f-display);color:#fff;background:var(--teal);border:0;border-radius:999px;padding:.55rem 1.1rem;cursor:pointer}
.say-name .ar{font-family:var(--f-ar);font-size:1.15rem;line-height:1}
.snd{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.snd h4{margin:0 0 6px;font:600 .72rem var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center}
.snd .row3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;direction:rtl}
.snd button{display:flex;flex-direction:column;align-items:center;gap:0;background:var(--gold-soft);border:2px solid transparent;border-radius:10px;padding:4px 2px 6px;cursor:pointer;color:var(--ink)}
.snd button:nth-child(2){background:#e3f7ef}.snd button:nth-child(3){background:#eef0ff}
.snd button .g{font-family:var(--f-ar);font-size:1.9rem;line-height:1.5}
.snd button small{direction:ltr;font-size:.72rem;color:var(--muted)}
.snd button:hover{border-color:var(--teal)}
.playing{animation:pop .5s ease}
@keyframes pop{50%{transform:scale(1.12)}}
@media (prefers-reduced-motion:reduce){.playing{animation:none}}
.novoice{font-size:.8rem;color:var(--muted);text-align:center;margin:10px 0 0}
.vowel-key{text-align:center;font-size:.75rem;color:var(--muted);margin-top:4px}

/* videos */
.alt{background:var(--surface);border-block:1px solid var(--line)}
.vids{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;margin-top:28px}
.vid{text-decoration:none;display:flex;flex-direction:column;gap:10px}
.thumb{aspect-ratio:16/9;max-width:100%;border-radius:12px;background:linear-gradient(135deg,#1fbf95,#0e8a6b);display:grid;place-items:center;position:relative;overflow:hidden}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb .ar{font-family:var(--f-ar);font-size:3rem;color:#fff;direction:rtl}
.thumb .play{position:absolute;z-index:1;right:10px;bottom:10px;width:38px;height:38px;border-radius:50%;background:var(--gold);display:grid;place-items:center}
.thumb .dur{position:absolute;z-index:1;left:10px;top:10px;font-size:.72rem;background:rgba(0,0,0,.55);color:#fff;padding:2px 8px;border-radius:999px}
.vid h3{font-size:1.02rem}
.vid p{margin:0;color:var(--muted);font-size:.88rem}
.vid:hover h3{color:var(--gold)}

/* editions */
.picker{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:20px;font-size:.88rem;color:var(--muted)}
.picker a{padding:.35rem .8rem;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none}
.picker a:hover{border-color:var(--teal)}
.eds{margin-top:24px}
.feat{display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px}
.feat .mini{aspect-ratio:3/4;max-width:100%;border-radius:6px 12px 12px 6px;background:linear-gradient(135deg,#1fbf95,#0e8a6b);color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:16px;box-shadow:10px 12px 0 -4px rgba(255,111,97,.55)}
.feat .mini .ar{font-family:var(--f-ar);font-size:4rem;text-align:center;line-height:1.4}
.feat .mini b{font-family:var(--f-display);font-size:1rem}.feat .mini small{opacity:.85;font-size:.75rem}
.fbody{display:flex;flex-direction:column;gap:8px;min-width:0}
.fbody .code{font-family:var(--f-display);font-weight:700;font-size:.8rem;letter-spacing:.08em;color:var(--teal)}
.fbody h3{font-size:1.5rem}.fbody .meta{color:var(--muted);margin:0}
.fbody .price{font-family:var(--f-display);font-weight:700;font-size:1.6rem;color:var(--gold)}
.fbody .row{display:flex;gap:10px;flex-wrap:wrap}.fbody .btn-ghost{color:var(--ink)}
@media (max-width:600px){.feat{grid-template-columns:1fr}.feat .mini{width:170px;margin:0 auto}}
.soon{grid-column:1/-1;background:var(--surface);border:2px dashed var(--teal);border-radius:14px;padding:28px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.soon .ar{font-family:var(--f-ar);font-size:2.4rem;color:var(--teal);line-height:1.3}.soon p{margin:0;font-weight:600}.soon .btn-ghost{color:var(--ink);margin-top:6px}
.fr-wide{grid-column:1/-1;flex-direction:row;align-items:center;gap:22px}.fr-wide .ar{font-size:3rem}
.ed{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.ed-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ed .code{font-family:var(--f-display);font-weight:700;font-size:.8rem;letter-spacing:.08em;color:var(--gold)}
.ed .price{font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums}
.ed h3{font-size:1.1rem}
.ed .meta{color:var(--muted);font-size:.85rem;margin:0}
.ed .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.ed .row .btn{padding:.55rem .95rem;font-size:.85rem}
.ed .btn-ghost{color:var(--ink)}

.stories{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:20px;margin-top:28px}
.story{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:12px;min-width:0}
.st-img{margin:-22px -22px 0;overflow:hidden;border-radius:18px 18px 0 0;border-bottom:1px solid var(--line)}.st-ph{aspect-ratio:4/5;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,#ffe7e4 0,transparent 45%),radial-gradient(circle at 75% 80%,#c9f0e0 0,transparent 50%),#f6fcf9}.st-ph span{font-family:var(--f-ar);font-size:4.5rem;color:var(--teal);line-height:1.4}
.st-img img{display:block;width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;object-position:50% 20%}
.st-head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.st-num{font:600 .72rem var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.st-ar{font-family:var(--f-ar);font-size:2rem;color:var(--teal);line-height:1.5;font-weight:700}
.st-title{margin:0;color:var(--muted);font-size:.92rem}
.st-text{font-family:var(--f-ar);font-size:1.35rem;line-height:2.1;color:var(--ink)}
.st-text p{margin:0 0 .35rem}
.st-play{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.st-listen{display:inline-flex;align-items:center;gap:8px;font:600 .9rem var(--f-display);color:#fff;background:var(--gold);border:0;border-radius:999px;padding:.55rem 1.1rem;cursor:pointer;box-shadow:0 5px 0 -2px #d94e41}
.st-listen svg{flex:none}
.st-listen[aria-pressed="true"]{background:var(--teal);box-shadow:0 5px 0 -2px #0e8a6b}
.st-rate{font:600 .8rem var(--f-display);color:var(--teal);background:transparent;border:2px solid var(--teal);border-radius:999px;padding:.35rem .8rem;cursor:pointer}
.st-msg{font-size:.85rem;color:var(--muted);margin:0}
.st-text .w{border-radius:6px;padding:0 2px;transition:background .15s,color .15s;cursor:pointer}
.st-text .w.read{color:var(--teal)}
.st-text .w.on{background:var(--gold);color:#fff}
.st-tog{align-self:flex-start;font:600 .85rem var(--f-display);color:var(--teal);background:transparent;border:2px solid var(--teal);border-radius:999px;padding:.45rem 1rem;cursor:pointer}
.st-tr{background:var(--bg);border-radius:12px;padding:12px 14px;font-size:.95rem;color:var(--ink)}
.st-tr p{margin:0}
.st-moral{margin:auto 0 0;background:var(--gold-soft);border-radius:12px;padding:10px 14px;font-size:.92rem}
.st-moral b{color:var(--gold)}
/* freebies */
.free{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:26px}
.fr{border:2px dashed var(--teal);border-radius:14px;padding:20px;text-decoration:none;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.fr .ar{font-family:var(--f-ar);font-size:2.2rem;color:var(--gold);direction:rtl;line-height:1.3}
.fr h3{font-size:1.05rem}
.fr p{margin:0;color:var(--muted);font-size:.88rem}
.fr .go{font-weight:600;font-size:.88rem;margin-top:6px}

/* steps */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px;margin-top:26px;counter-reset:s}
.step{counter-increment:s}
.step::before{content:counter(s);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--teal);color:#fff;font-family:var(--f-display);font-weight:700;margin-bottom:10px}
.step h3{font-size:1.05rem}.step p{margin:.3rem 0 0;color:var(--muted);font-size:.92rem}

footer{background:var(--navy);color:var(--on-navy);padding-block:40px;font-size:.9rem}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:20px;align-items:center}
.social{display:flex;gap:10px;flex-wrap:wrap}
.social a{text-decoration:none;border:1px solid rgba(31,42,68,.3);background:#fff8;padding:.45rem .9rem;border-radius:999px}
.social a:hover{border-color:var(--gold);color:var(--gold)}
footer small{opacity:.7}
.langs{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:10px;font-size:.8rem}.langs a{text-decoration:none;opacity:.8}.langs a:hover{opacity:1;text-decoration:underline}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.lang{display:inline-flex}
.lang select{font:600 .85rem var(--f-display);color:var(--on-navy);background:#fff;border:1px solid var(--line);border-radius:999px;padding:.45rem 2rem .45rem .9rem;cursor:pointer;appearance:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.nav-right{display:flex;align-items:center;gap:1.2rem}
</style>

<header class="top">
  <div class="wrap nav">
    <a class="brand" href="#top"><svg class="mark" viewBox="40 30 330 320" aria-hidden="true"><g fill="none" stroke="#0e8a6b" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"> <path d="M200 232 C226 146 345 132 340 196 C337 240 262 238 200 232"/> <path d="M200 232 L200 204"/> <path d="M200 232 C206 330 66 338 70 210"/></g><g transform="translate(262 82)"> <g transform="rotate(-22)"><ellipse rx="56" ry="15" fill="none" stroke="#ff6f61" stroke-width="7"/></g> <circle r="28" fill="#ff6f61"/> <g fill="none" stroke="#ffffff" stroke-width="4"><ellipse rx="11" ry="27"/><line x1="-27" y1="0" x2="27" y2="0"/></g> <g transform="rotate(-22)"><path d="M-56 0 A56 15 0 0 0 56 0" fill="none" stroke="#ff6f61" stroke-width="7"/></g></g></svg><span>Arabic <b>Orbit</b></span></a>
    <div class="nav-right">

</header>

<main id="top">
<section class="hero">
  <div class="wrap hero-grid">
    <div>
      <div class="eyebrow" data-i18n="tag"></div>
      <h1 data-i18n="h1"></h1>
      <p data-i18n="heroP"></p>
      <div class="ctas">
        <a class="btn btn-gold" href="#books" data-i18n="cta1"></a>
        <a class="btn btn-ghost" href="#free" data-i18n="cta2"></a>
      </div>
      <div class="facts">
        <div><strong>11</strong><span data-i18n="f1"></span></div>

      </div>

  <div class="wrap">
    <div class="eyebrow" data-i18n="lEy"></div>

      <div class="alpha" id="alpha" role="group" aria-label="Arabic alphabet"></div>

        <div class="sound" id="dSound"></div>
        <div class="forms" id="dForms"></div>
        <button type="button" class="say-name" id="sayName"></button>
        <div class="snd" id="dSnd"></div>
        <div class="vowel-key" data-i18n="vKey"></div>
        <p class="novoice" id="noVoice" hidden></p>
      </aside>
    </div>
  </div>
</section>

<section id="videos" class="alt">
  <div class="wrap">
    <div class="eyebrow" data-i18n="vEy"></div>
    <h2 data-i18n="vH"></h2>
    <p class="lead" data-i18n="vP"></p>
    <div class="vids" id="vids"></div>
  </div>
</section>

<section id="stories">
  <div class="wrap">
    <div class="eyebrow" id="stEy"></div>
    <h2 id="stH"></h2>
    <p class="lead" id="stP"></p>
    <div class="stories" id="storyList"></div>
  </div>
</section>

<section id="books">
  <div class="wrap">
    <div class="eyebrow" data-i18n="bEy"></div>
    <h2 data-i18n="bH"></h2>
    <p class="lead" data-i18n="bP"></p>
    <div class="eds" id="eds"></div>
    <div class="picker" id="picker"></div>
  </div>
</section>

<section id="free" class="alt">
  <div class="wrap">
    <div class="eyebrow" data-i18n="frEy"></div>
    <h2 data-i18n="frH"></h2>
    <p class="lead" data-i18n="frP"></p>
    <div class="free" id="freeList"></div>
  </div>
</section>

<section>
  <div class="wrap">
    <div class="eyebrow" data-i18n="sEy"></div>
    <h2 data-i18n="sH"></h2>
    <div class="steps">

let arVoice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();arVoice=vs.find(v=>/^ar(-|_|$)/i.test(v.lang)&&/google/i.test(v.name))||vs.find(v=>/^ar/i.test(v.lang))||null}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function say(text,el){
  if(el){el.classList.remove("playing");void el.offsetWidth;el.classList.add("playing")}
  try{
    if(!("speechSynthesis" in window))throw 0;
    pickVoice();speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);u.lang="ar-SA";u.rate=.75;if(arVoice)u.voice=arVoice;
    let started=false;u.onstart=()=>{started=true;$("noVoice").hidden=true};
    setTimeout(()=>{if(!started)$("noVoice").hidden=false},1800);
    speechSynthesis.speak(u);
  }catch(e){$("noVoice").hidden=false}
}
function syl(i){
  const c=L[i][0],b=i===0?"أ":c,ib=i===0?"إ":c,l=LAT[i]==="ʾ"?"":LAT[i];
  const sh=[[b+"َ",l+"a"],[ib+"ِ",l+"i"],[b+"ُ",l+"u"]];
  const lo=[[i===0?"آ":c+"َا",l+"ā"],[ib+"ِي",l+"ī"],[b+"ُو",l+"ū"]];
  const tn=[[i===0?"أً":c+"ًا",l+"an"],[ib+"ٍ",l+"in"],[b+"ٌ",l+"un"]];
  return [sh,lo,tn];
}
function showLetter(i){
  cur=i;const [c,n,j]=L[i],t=T[lang];
  $("dBig").textContent=c;$("dName").textContent=n;$("dSound").textContent=t.sound?t.sound[i]:t.soundLabel+": "+GEN[i];
  const f=[c,j?c+Z:c,Z+c+(j?Z:""),Z+c];
  $("dForms").innerHTML=f.map((g,k)=>`<div><span class="g">${g}</span><small>${t.forms[k]}</small></div>`).join("");
  const sl=SL[lang]||SL.en,groups=syl(i);
  $("sayName").innerHTML=`<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg> ${sl[0]} · <span class="ar">${ARN[i]}</span>`;
  $("sayName").onclick=e=>say(ARN[i],e.currentTarget);$("dBig").onclick=e=>say(ARN[i],e.currentTarget);
  $("noVoice").textContent=sl[4];
  $("dSnd").innerHTML=groups.map((g,k)=>`<div><h4>${sl[k+1]}</h4><div class="row3">${g.map(([a,r])=>`<button type="button" data-say="${a}"><span class="g">${a}</span><small>${r}</small></button>`).join("")}</div></div>`).join("");
  $("dSnd").querySelectorAll("button").forEach(btn=>btn.onclick=()=>say(btn.dataset.say,btn));
  $("alpha").querySelectorAll("button").forEach((b,k)=>b.setAttribute("aria-pressed",k===i));
}
$("alpha").innerHTML="";L.forEach((l,i)=>{const b=document.createElement("button");b.type="button";b.id="letter-"+i;b.textContent=l[0];b.setAttribute("aria-label",l[1]);b.onclick=()=>{showLetter(i);say(ARN[i],b)};$("alpha").appendChild(b)});

function renderEditions(){
  const t=T[lang],x=X[lang],me=E.find(e=>e[0]===CODE[lang]);
  $("eds").innerHTML=`<article class="feat"><div class="mini"><span class="ar">ض</span><b>${t.bookT}</b><small>${me[1]}</small></div><div class="fbody"><span class="code">${me[0]} · ${me[1]}</span><h3>${me[2]}</h3><p class="meta">${t.edMeta}</p><div class="price">${esc(PRICE)}</div><div class="row"><a class="btn btn-gold" href="${P+me[3]}" target="_blank" rel="noopener">${me[5]}</a><a class="btn btn-ghost" href="${P+me[4]}" target="_blank" rel="noopener">${me[6]}</a></div></div></article>`;
  $("picker").innerHTML=`<span>${x[4]}:</span>`+E.filter(e=>e!==me).map(e=>`<a href="${P+e[3]}" target="_blank" rel="noopener">${e[1]}</a>`).join("");
}

/* ===== Juha stories. Arabic text is shared; translations per language. To add a story: add one entry to STORIES and its translation to each language in STR. ===== */
const STR={
en:{ui:["Juha stories","Laugh and learn with Juha","Juha is the most famous joker of Arab folk tales. Each story is short, fully vowelled, and comes with a translation. Read the Arabic first, then check the meaning.","Show translation","Hide translation","Moral","Story","Stories"],
 s:[["Juha, his son and the donkey","Juha and his son went to the market with their donkey. Juha rode the donkey and his son walked. People said: “What a harsh father!” Juha got off and his son rode. People said: “A boy who does not respect his father!” They both rode. People said: “Poor donkey!” They both walked. People laughed: “They have a donkey and don’t ride it!” Juha told his son: “My son, you can never please everyone.”","You can never please everyone."],
 ["Juha’s nail","Juha sold his house to a man with one condition: one nail in the wall stays his. The man agreed: “A small nail, no problem.” A few days later Juha came and hung an old robe on the nail. The next day he came to visit his nail and sat in the house. Then he came at night and slept under his nail! The man grew tired and left the house to Juha.","A small excuse can become a big problem."],
 ["Eat, my sleeve!","Juha went to a feast in old clothes, and nobody paid attention to him. He went home and put on beautiful new clothes. He returned to the feast; people welcomed him and seated him in the best place. They served him food, and Juha held his sleeve to the food and said: “Eat, my sleeve, eat!” People were surprised. Juha said: “You honoured the clothes, not me!”","Respect people for who they are, not for their clothes."]]},
fr:{ui:["Histoires de Joha","Rire et apprendre avec Joha","Joha est le farceur le plus célèbre des contes arabes. Chaque histoire est courte, entièrement vocalisée et accompagnée d'une traduction. Lisez d'abord l'arabe, puis vérifiez le sens.","Voir la traduction","Masquer la traduction","Morale","Histoire","Histoires"],
 s:[["Joha, son fils et l'âne","Joha et son fils allèrent au marché avec leur âne. Joha monta sur l'âne et son fils marcha. Les gens dirent : « Quel père dur ! » Joha descendit et son fils monta. Les gens dirent : « Un fils qui ne respecte pas son père ! » Ils montèrent tous les deux. Les gens dirent : « Pauvre âne ! » Ils marchèrent tous les deux. Les gens rirent : « Ils ont un âne et ne le montent pas ! » Joha dit à son fils : « Mon fils, on ne peut jamais plaire à tout le monde. »","On ne peut pas plaire à tout le monde."],
 ["Le clou de Joha","Joha vendit sa maison à un homme, à une condition : un clou dans le mur reste à lui. L'homme accepta : « Un petit clou, pas de problème. » Quelques jours plus tard, Joha vint accrocher un vieux manteau au clou. Le lendemain, il vint rendre visite à son clou et s'assit dans la maison. Puis il vint la nuit et dormit sous son clou ! L'homme, épuisé, laissa la maison à Joha.","Un petit prétexte peut devenir un grand problème."],
 ["Mange, ma manche !","Joha alla à un festin en vieux habits, et personne ne fit attention à lui. Il rentra chez lui et mit de beaux habits neufs. Il revint au festin : on l'accueillit et on l'installa à la meilleure place. On lui servit à manger ; Joha approcha sa manche du plat et dit : « Mange, ma manche, mange ! » Les gens s'étonnèrent. Joha dit : « C'est mes habits que vous avez honorés, pas moi ! »","Respectez les gens pour ce qu'ils sont, pas pour leurs habits."]]},
es:{ui:["Cuentos de Yuha","Ríe y aprende con Yuha","Yuha es el bromista más famoso de los cuentos árabes. Cada cuento es corto, con todas las vocales y con traducción. Lee primero el árabe y luego comprueba el significado.","Ver traducción","Ocultar traducción","Moraleja","Cuento","Cuentos"],
 s:[["Yuha, su hijo y el burro","Yuha y su hijo fueron al mercado con su burro. Yuha montó el burro y su hijo caminó. La gente dijo: «¡Qué padre tan duro!». Yuha bajó y montó su hijo. La gente dijo: «¡Un hijo que no respeta a su padre!». Montaron los dos. La gente dijo: «¡Pobre burro!». Caminaron los dos. La gente se rio: «¡Tienen un burro y no lo montan!». Yuha le dijo a su hijo: «Hijo mío, nunca se puede contentar a todos».","Nunca se puede contentar a todos."],
 ["El clavo de Yuha","Yuha vendió su casa a un hombre con una condición: un clavo de la pared seguiría siendo suyo. El hombre aceptó: «Un clavo pequeño, no pasa nada». Días después, Yuha vino y colgó una túnica vieja en el clavo. Al día siguiente vino a visitar su clavo y se sentó en la casa. ¡Luego vino de noche y durmió bajo su clavo! El hombre, cansado, le dejó la casa a Yuha.","Una pequeña excusa puede convertirse en un gran problema."],
 ["¡Come, manga mía!","Yuha fue a un banquete con ropa vieja y nadie le hizo caso. Volvió a casa y se puso ropa nueva y bonita. Regresó al banquete: lo recibieron y lo sentaron en el mejor sitio. Le sirvieron comida y Yuha acercó su manga al plato diciendo: «¡Come, manga mía, come!». La gente se sorprendió. Yuha dijo: «¡Ustedes honraron la ropa, no a mí!».","Respeta a las personas por lo que son, no por su ropa."]]},
pt:{ui:["Histórias de Juha","Ria e aprenda com Juha","Juha é o brincalhão mais famoso dos contos árabes. Cada história é curta, com todas as vogais e com tradução. Leia primeiro o árabe e depois confira o sentido.","Ver tradução","Ocultar tradução","Moral","História","Histórias"],
 s:[["Juha, o filho e o burro","Juha e o filho foram ao mercado com o burro. Juha montou o burro e o filho foi a pé. As pessoas disseram: «Que pai cruel!» Juha desceu e o filho montou. As pessoas disseram: «Um filho que não respeita o pai!» Montaram os dois. As pessoas disseram: «Coitado do burro!» Foram os dois a pé. As pessoas riram: «Têm um burro e não montam nele!» Juha disse ao filho: «Meu filho, nunca se consegue agradar a todos.»","Nunca se consegue agradar a todos."],
 ["O prego de Juha","Juha vendeu a casa a um homem com uma condição: um prego na parede continuaria sendo dele. O homem aceitou: «Um preguinho, tudo bem.» Dias depois, Juha veio e pendurou uma túnica velha no prego. No dia seguinte, veio visitar o prego e sentou-se na casa. Depois veio à noite e dormiu debaixo do prego! O homem, cansado, deixou a casa para Juha.","Uma pequena desculpa pode virar um grande problema."],
 ["Come, minha manga!","Juha foi a um banquete com roupas velhas e ninguém lhe deu atenção. Voltou para casa e vestiu roupas novas e bonitas. Voltou ao banquete: receberam-no bem e sentaram-no no melhor lugar. Serviram-lhe comida, e Juha aproximou a manga do prato dizendo: «Come, minha manga, come!» As pessoas estranharam. Juha disse: «Vocês honraram as roupas, não a mim!»","Respeite as pessoas pelo que são, não pelas roupas."]]},
it:{ui:["Storie di Giufà","Ridi e impara con Giufà","Giufà (Juha) è il burlone più famoso delle fiabe arabe. Ogni storia è breve, completamente vocalizzata e tradotta. Leggi prima l'arabo, poi controlla il significato.","Mostra traduzione","Nascondi traduzione","Morale","Storia","Storie"],
 s:[["Giufà, suo figlio e l'asino","Giufà e suo figlio andarono al mercato con l'asino. Giufà salì sull'asino e il figlio camminava. La gente disse: «Che padre crudele!» Giufà scese e salì il figlio. La gente disse: «Un figlio che non rispetta il padre!» Salirono tutti e due. La gente disse: «Povero asino!» Camminarono tutti e due. La gente rise: «Hanno un asino e non ci salgono!» Giufà disse al figlio: «Figlio mio, non si può mai accontentare tutti.»","Non si può accontentare tutti."],
 ["Il chiodo di Giufà","Giufà vendette la casa a un uomo a una condizione: un chiodo nel muro restava suo. L'uomo accettò: «Un chiodino, va bene.» Qualche giorno dopo Giufà venne e appese al chiodo una vecchia tunica. Il giorno dopo venne a trovare il suo chiodo e si sedette in casa. Poi venne di notte e dormì sotto il suo chiodo! L'uomo, stanco, lasciò la casa a Giufà.","Una piccola scusa può diventare un grande problema."],
 ["Mangia, manica mia!","Giufà andò a un banchetto con vestiti vecchi e nessuno gli badò. Tornò a casa e indossò vestiti nuovi e belli. Tornò al banchetto: lo accolsero e lo fecero sedere al posto migliore. Gli servirono da mangiare e Giufà avvicinò la manica al piatto dicendo: «Mangia, manica mia, mangia!» La gente si stupì. Giufà disse: «Avete onorato i vestiti, non me!»","Rispetta le persone per ciò che sono, non per i vestiti."]]},
de:{ui:["Dschuha-Geschichten","Lachen und lernen mit Dschuha","Dschuha ist der berühmteste Spaßvogel der arabischen Volksmärchen. Jede Geschichte ist kurz, voll vokalisiert und übersetzt. Lies zuerst das Arabische und prüfe dann die Bedeutung.","Übersetzung zeigen","Übersetzung ausblenden","Moral","Geschichte","Geschichten"],
 s:[["Dschuha, sein Sohn und der Esel","Dschuha und sein Sohn gingen mit ihrem Esel zum Markt. Dschuha ritt, der Sohn ging zu Fuß. Die Leute sagten: „Was für ein harter Vater!“ Dschuha stieg ab und der Sohn ritt. Die Leute sagten: „Ein Sohn, der seinen Vater nicht achtet!“ Beide ritten. Die Leute sagten: „Armer Esel!“ Beide gingen zu Fuß. Die Leute lachten: „Sie haben einen Esel und reiten nicht!“ Dschuha sagte zu seinem Sohn: „Mein Sohn, man kann es nie allen recht machen.“","Man kann es nie allen recht machen."],
 ["Dschuhas Nagel","Dschuha verkaufte sein Haus unter einer Bedingung: Ein Nagel in der Wand bleibt seiner. Der Käufer stimmte zu: „Ein kleiner Nagel, kein Problem.“ Ein paar Tage später hängte Dschuha einen alten Mantel an den Nagel. Am nächsten Tag besuchte er seinen Nagel und setzte sich ins Haus. Dann kam er nachts und schlief unter seinem Nagel! Der Mann war es leid und überließ Dschuha das Haus.","Ein kleiner Vorwand kann zu einem großen Problem werden."],
 ["Iss, mein Ärmel!","Dschuha ging in alten Kleidern zu einem Festmahl, und niemand beachtete ihn. Er ging nach Hause und zog schöne neue Kleider an. Als er zurückkam, begrüßte man ihn und setzte ihn auf den besten Platz. Man servierte ihm Essen, und Dschuha hielt seinen Ärmel ans Essen: „Iss, mein Ärmel, iss!“ Die Leute staunten. Dschuha sagte: „Ihr habt die Kleider geehrt, nicht mich!“","Achte Menschen für das, was sie sind, nicht für ihre Kleidung."]]},
nl:{ui:["Verhalen van Djoeha","Lachen en leren met Djoeha","Djoeha is de bekendste grappenmaker uit de Arabische volksverhalen. Elk verhaal is kort, volledig gevocaliseerd en vertaald. Lees eerst het Arabisch en controleer daarna de betekenis.","Vertaling tonen","Vertaling verbergen","Moraal","Verhaal","Verhalen"],
 s:[["Djoeha, zijn zoon en de ezel","Djoeha en zijn zoon gingen met hun ezel naar de markt. Djoeha reed en zijn zoon liep. De mensen zeiden: „Wat een harde vader!” Djoeha stapte af en zijn zoon reed. De mensen zeiden: „Een zoon die zijn vader niet respecteert!” Ze reden samen. De mensen zeiden: „Arme ezel!” Ze liepen samen. De mensen lachten: „Ze hebben een ezel en rijden er niet op!” Djoeha zei tegen zijn zoon: „Mijn zoon, je kunt het nooit iedereen naar de zin maken.”","Je kunt het nooit iedereen naar de zin maken."],
 ["De spijker van Djoeha","Djoeha verkocht zijn huis op één voorwaarde: één spijker in de muur bleef van hem. De koper stemde in: „Een klein spijkertje, geen probleem.” Een paar dagen later hing Djoeha een oude mantel aan de spijker. De volgende dag kwam hij zijn spijker bezoeken en ging in het huis zitten. Toen kwam hij ’s nachts en sliep onder zijn spijker! De man had er genoeg van en liet het huis aan Djoeha.","Een klein excuus kan een groot probleem worden."],
 ["Eet, mijn mouw!","Djoeha ging in oude kleren naar een feestmaal en niemand lette op hem. Hij ging naar huis en trok mooie nieuwe kleren aan. Toen hij terugkwam, werd hij hartelijk ontvangen en op de beste plek gezet. Men bracht hem eten en Djoeha hield zijn mouw bij het eten: „Eet, mijn mouw, eet!” De mensen keken verbaasd. Djoeha zei: „Jullie eerden mijn kleren, niet mij!”","Respecteer mensen om wie ze zijn, niet om hun kleren."]]},
tr:{ui:["Cuha (Nasreddin Hoca) hikâyeleri","Cuha ile gül ve öğren","Cuha, Arap halk hikâyelerinin en ünlü şakacısıdır; Türkiye'de Nasreddin Hoca olarak bilinir. Her hikâye kısa, tamamen harekeli ve çevirilidir. Önce Arapçasını okuyun, sonra anlamına bakın.","Çeviriyi göster","Çeviriyi gizle","Ders","Hikâye","Hikâyeler"],
 s:[["Cuha, oğlu ve eşek","Cuha ile oğlu eşekleriyle pazara gittiler. Cuha eşeğe bindi, oğlu yürüdü. İnsanlar dedi ki: “Ne katı bir baba!” Cuha indi, oğlu bindi. İnsanlar dedi ki: “Babasına saygısı olmayan bir çocuk!” İkisi birlikte bindiler. İnsanlar dedi ki: “Zavallı eşek!” İkisi birlikte yürüdüler. İnsanlar güldü: “Eşekleri var ama binmiyorlar!” Cuha oğluna dedi ki: “Oğlum, herkesi memnun etmek imkânsızdır.”","Herkesi memnun etmek imkânsızdır."],
 ["Cuha'nın çivisi","Cuha evini bir adama tek bir şartla sattı: duvardaki bir çivi onun kalacaktı. Adam kabul etti: “Küçük bir çivi, sorun değil.” Birkaç gün sonra Cuha gelip çiviye eski bir cübbe astı. Ertesi gün çivisini ziyarete gelip evde oturdu. Sonra gece gelip çivisinin altında uyudu! Adam bıktı ve evi Cuha'ya bıraktı.","Küçük bir bahane büyük bir soruna dönüşebilir."],
 ["Ye kürküm ye!","Cuha bir ziyafete eski elbiselerle gitti ve kimse ona ilgi göstermedi. Eve dönüp güzel, yeni elbiseler giydi. Ziyafete geri döndüğünde onu karşıladılar ve en iyi yere oturttular. Önüne yemek koydular; Cuha kürkünün yenini yemeğe yaklaştırıp dedi ki: “Ye kürküm, ye!” İnsanlar şaşırdı. Cuha dedi ki: “Siz bana değil, elbiselerime ikram ettiniz!”","İnsanlara kıyafetlerine göre değil, kim olduklarına göre değer verin."]]},
ru:{ui:["Истории о Джухе","Смейтесь и учитесь с Джухой","Джуха — самый известный шутник арабских сказок (его также знают как Ходжу Насреддина). Каждая история короткая, полностью огласованная и с переводом. Сначала прочитайте по-арабски, затем проверьте смысл.","Показать перевод","Скрыть перевод","Мораль","История","Истории"],
 s:[["Джуха, его сын и осёл","Джуха с сыном пошли на рынок со своим ослом. Джуха ехал на осле, а сын шёл пешком. Люди сказали: «Какой жестокий отец!» Джуха слез, и сел сын. Люди сказали: «Сын, который не уважает отца!» Они сели вдвоём. Люди сказали: «Бедный осёл!» Они пошли пешком вдвоём. Люди засмеялись: «У них есть осёл, а они не едут!» Джуха сказал сыну: «Сынок, на всех не угодишь».","На всех не угодишь."],
 ["Гвоздь Джухи","Джуха продал дом одному человеку с одним условием: гвоздь в стене останется его. Человек согласился: «Маленький гвоздь — не страшно». Через несколько дней Джуха пришёл и повесил на гвоздь старый халат. На следующий день он пришёл навестить свой гвоздь и уселся в доме. А потом пришёл ночью и уснул под своим гвоздём! Хозяин устал и оставил дом Джухе.","Маленький предлог может стать большой проблемой."],
 ["Ешь, мой рукав!","Джуха пришёл на пир в старой одежде, и никто не обратил на него внимания. Он вернулся домой и надел красивую новую одежду. Когда он вернулся, его встретили и усадили на лучшее место. Ему подали еду, а Джуха поднёс рукав к блюду и сказал: «Ешь, мой рукав, ешь!» Люди удивились. Джуха сказал: «Вы почтили одежду, а не меня!»","Уважайте людей за то, кто они, а не за их одежду."]]},
id:{ui:["Kisah Juha","Tertawa dan belajar bersama Juha","Juha adalah tokoh jenaka paling terkenal dalam cerita rakyat Arab. Setiap kisah pendek, berharakat lengkap, dan ada terjemahannya. Baca dulu bahasa Arabnya, lalu cek artinya.","Lihat terjemahan","Sembunyikan terjemahan","Hikmah","Kisah","Kisah"],
 s:[["Juha, anaknya, dan keledai","Juha dan anaknya pergi ke pasar bersama keledai mereka. Juha menunggang keledai dan anaknya berjalan. Orang-orang berkata: “Ayah yang kejam!” Juha turun dan anaknya naik. Orang-orang berkata: “Anak yang tidak menghormati ayahnya!” Mereka naik berdua. Orang-orang berkata: “Kasihan keledainya!” Mereka berjalan berdua. Orang-orang tertawa: “Punya keledai tapi tidak dinaiki!” Juha berkata kepada anaknya: “Anakku, kita tidak akan pernah bisa menyenangkan semua orang.”","Kita tidak bisa menyenangkan semua orang."],
 ["Paku Juha","Juha menjual rumahnya kepada seorang laki-laki dengan satu syarat: satu paku di dinding tetap miliknya. Laki-laki itu setuju: “Paku kecil, tidak apa-apa.” Beberapa hari kemudian Juha datang dan menggantungkan jubah tua di paku itu. Besoknya ia datang menjenguk pakunya dan duduk di rumah. Lalu ia datang malam hari dan tidur di bawah pakunya! Laki-laki itu lelah dan menyerahkan rumah itu kepada Juha.","Alasan kecil bisa menjadi masalah besar."],
 ["Makanlah, wahai lengan bajuku!","Juha datang ke jamuan dengan pakaian lusuh, dan tidak ada yang memedulikannya. Ia pulang dan memakai pakaian baru yang indah. Ia kembali ke jamuan; orang-orang menyambutnya dan mendudukkannya di tempat terbaik. Mereka menghidangkan makanan, lalu Juha mendekatkan lengan bajunya ke makanan sambil berkata: “Makanlah, lengan bajuku, makanlah!” Orang-orang heran. Juha berkata: “Kalian memuliakan pakaianku, bukan aku!”","Hargailah orang karena dirinya, bukan karena pakaiannya."]]},
zh:{ui:["朱哈的故事","跟朱哈一起笑着学","朱哈是阿拉伯民间故事中最有名的幽默人物。每个故事都很短，全部标注元音，并附有翻译。先读阿拉伯语，再看意思。","显示翻译","隐藏翻译","寓意","故事","故事"],
 s:[["朱哈、儿子和驴","朱哈和儿子牵着驴去集市。朱哈骑驴，儿子走路。人们说：“多么狠心的父亲！”朱哈下来，儿子骑上去。人们说：“不尊敬父亲的孩子！”两人一起骑。人们说：“可怜的驴！”两人一起走。人们笑道：“有驴却不骑！”朱哈对儿子说：“孩子，你永远无法让所有人满意。”","你无法让所有人满意。"],
 ["朱哈的钉子","朱哈把房子卖给一个人，只提了一个条件：墙上的一颗钉子仍归他所有。那人同意了：“一颗小钉子，没关系。”几天后，朱哈来把一件旧袍子挂在钉子上。第二天，他来“看望”他的钉子，在屋里坐着。后来他夜里也来，睡在钉子下面！那人受不了，把房子让给了朱哈。","一个小借口可能变成大麻烦。"],
 ["吃吧，我的袖子！","朱哈穿着旧衣服去赴宴，没有人理他。他回家换上漂亮的新衣服。再回到宴会时，人们热情欢迎他，请他坐在最好的位置。饭菜端上来，朱哈把袖子凑近饭菜说：“吃吧，我的袖子，吃吧！”大家很惊讶。朱哈说：“你们尊重的是衣服，不是我！”","尊重一个人要看他本人，而不是他的衣服。"]]}
